<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=http://127.0.0.1:8080/">
    <title>Opening Field Updates Hub...</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #15803d 0%, #166534 100%);
            color: white;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        h1 { margin-bottom: 20px; }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: #fbbf24;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
        }
        a:hover { text-decoration: underline; }
        .urls {
            margin-top: 30px;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 10px;
        }
        .urls a {
            display: block;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌾 Opening Field Updates Hub...</h1>
        <div class="spinner"></div>
        <p>You should be redirected automatically.</p>
        <div class="urls">
            <p><strong>If not, click one of these:</strong></p>
            <a href="http://127.0.0.1:8080/" target="_blank">http://127.0.0.1:8080/</a>
            <a href="http://localhost:8080/" target="_blank">http://localhost:8080/</a>
            <a href="http://192.168.18.5:8080/" target="_blank">http://192.168.18.5:8080/</a>
        </div>
    </div>
    <script>
        // Force redirect after 1 second
        setTimeout(function() {
            window.location.href = 'http://127.0.0.1:8080/';
        }, 1000);
    </script>
</body>
</html>
