<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed - Field Updates Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white shadow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <h1 class="text-xl font-bold text-gray-900">Field Updates Hub</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-gray-700">Welcome, {{ user.username }}!</span>
                    <a href="{% url 'logout' %}" class="text-red-600 hover:text-red-800">Logout</a>
                </div>
            </div>
        </div>
    </nav>
    
    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        <div class="px-4 py-6 sm:px-0">
            <div class="text-center">
                <h2 class="text-2xl font-bold text-gray-900 mb-4">Welcome to Field Updates Hub!</h2>
                <p class="text-gray-600 mb-8">Your agricultural community platform is ready.</p>
                <div class="bg-green-50 border border-green-200 rounded-lg p-6 max-w-md mx-auto">
                    <h3 class="text-lg font-semibold text-green-800 mb-2">🎉 Authentication Complete!</h3>
                    <p class="text-green-700">You've successfully logged in. The feed page will be implemented in the next phase.</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
